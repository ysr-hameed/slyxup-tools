    <linearGradient
      id="snakeBottom"
      x1="125"
      y1="400"
      x2="340"
      y2="245"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#076E6A"/>
      <stop offset="0.5" stop-color="#09AFA6"/>
      <stop offset="1" stop-color="#3BE1D8"/>
