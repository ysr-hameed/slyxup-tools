    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="11"
        stdDeviation="14"
        flood-color="#00BDB3"
        flood-opacity="0.16"
      />
    </filter>
  </defs>

  <!-- MAIN S / SNAKE BODY -->
  <path
