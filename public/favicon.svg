      C96 202 112 239 151 266
      C170 279 194 291 218 303

      C234 311 243 320 241 331
      C239 343 225 348 210 343

      C191 337 174 327 157 318

      L113 370

      C132 385 151 398 173 408
      C219 430 273 426 305 397
      C337 369 342 327 320 294
      C304 269 278 251 247 235

      L201 211

      C185 202 178 193 182 182
      C187 167 204 157 224 155

      C258 151 291 160 321 182

      L368 91
      Z
    "
    fill="url(#snakeTeal)"
    filter="url(#shadow)"
  />

  <!-- SNAKE HEAD / UPPER PLANE -->
  <path
    d="
      M368 91

      C335 72 294 66 255 72
      C208 78 169 96 141 123
      C121 143 112 166 111 188
      C109 220 126 246 157 267

      C176 279 198 289 219 301

      L247 235
      L201 211

      C185 202 178 193 182 182

      C187 167 204 157 224 155

      C258 151 291 160 321 182

