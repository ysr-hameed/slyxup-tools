<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  fill="none"
>
  <defs>
    <linearGradient
      id="snakeTeal"
      x1="105"
      y1="415"
      x2="405"
      y2="85"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#08736F"/>
      <stop offset="0.38" stop-color="#08AFA7"/>
      <stop offset="0.72" stop-color="#25D8CE"/>
      <stop offset="1" stop-color="#7AFFF7"/>
    </linearGradient>

    <linearGradient
      id="snakeTop"
      x1="120"
      y1="105"
      x2="370"
      y2="270"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#07958F"/>
      <stop offset="0.52" stop-color="#16C7BE"/>
      <stop offset="1" stop-color="#64F4EB"/>
