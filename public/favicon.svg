  <!-- TAPERED TAIL ACCENT -->
  <path
    d="
      M157 318
      L113 370
      C126 380 139 388 153 395
      L177 356
      Z
    "
    fill="#086E6A"
    opacity="0.65"
  />

  <!-- HEAD HIGHLIGHT -->
  <path
    d="
      M368 91
      L350 127
    "
    stroke="#D9FFFC"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.72"
  />

  <!-- SMALL HEAD TIP -->
  <circle
    cx="368"
    cy="91"
    r="6"
    fill="#E8FFFD"
  />
