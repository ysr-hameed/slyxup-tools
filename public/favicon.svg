  />

  <!-- LOWER BODY -->
  <path
    d="
      M247 235

      C276 250 300 267 317 291
      C340 323 335 365 304 395

      C272 426 219 430 173 408

      C151 398 132 385 113 370

      L157 318

      C174 327 191 337 210 343

      C225 348 239 343 241 331

      C243 320 234 311 218 303

      C199 293 177 281 157 267

      Z
    "
    fill="url(#snakeBottom)"
  />

  <!-- INNER SNAKE-LIKE SCALE / INTERLOCK -->
  <path
    d="
      M201 211
      C218 220 237 230 254 238
      C281 251 302 267 316 286

      L291 311

      C278 294 259 280 239 270
      L198 249
      C188 244 181 239 176 234

      Z
    "
    fill="#078F88"
